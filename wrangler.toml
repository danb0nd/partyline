name = "partyline"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Optional custom domain (Dashboard → Workers → partyline → Custom domains), or:
# routes = [{ pattern = "partyline.bonjia.tech", custom_domain = true }]

[vars]
APP_NAME = "Partyline"

# Secrets (do not put real values here):
#   wrangler secret put SESSION_SECRET
#   wrangler secret put RESEND_API_KEY          # optional
# Optional vars (wrangler.toml [vars] or Dashboard):
#   FROM_EMAIL, APP_URL, DEV_AUTH

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

# Replace database_id after: npx wrangler d1 create partyline
[[d1_databases]]
binding = "DB"
database_name = "partyline"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Create first: npx wrangler r2 bucket create partyline-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "partyline-media"
